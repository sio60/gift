<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎁 선물이 도착했어요!</title>
<meta property="og:title" content="🎁 선물이 도착했어요!">
<meta property="og:description" content="상자를 눌러서 열어보세요">
<link rel="preload" as="image" href="img/surprise.jpg">
<style>
  :root { --bg1:#ffe6f0; --bg2:#fff6d6; --ink:#4a2a3a; --accent:#ff4d79; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body {
    font-family: "Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);
    background: radial-gradient(circle at 50% 40%, var(--bg2), var(--bg1));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:16px; text-align:center; user-select:none;
  }
  h1 { font-size:clamp(26px,7vw,46px); margin:0; letter-spacing:-1px; }
  #hint { font-size:clamp(16px,4.5vw,22px); opacity:.75; margin:0; min-height:1.4em; }
  #stage { position:relative; width:min(72vw,360px); aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  #drum {
    position:absolute; left:-16%; bottom:-16%; width:62%; z-index:2; opacity:0; transform:scale(.6) rotate(-10deg);
    filter:drop-shadow(0 8px 10px rgba(120,40,70,.25));
    transition:opacity .25s, transform .25s; pointer-events:none;
  }
  #drum.show { left:0; bottom:0; width:100%; opacity:1; transform:scale(1); }
  #drum.hit { animation:hit .12s ease-in-out infinite alternate; }
  #drum.hard { animation-duration:.07s; }
  @keyframes hit { from{transform:scale(1) rotate(-2deg) translateY(0)} to{transform:scale(1.04) rotate(2deg) translateY(6px)} }
  #stage.rolling #box { display:none; }
  #box {
    width:100%; cursor:pointer; filter:drop-shadow(0 14px 18px rgba(120,40,70,.28));
    animation:bob 1.6s ease-in-out infinite;
  }
  #box.shake { animation:shake .09s linear infinite; }
  #box.shake.hard { animation:shakeHard .06s linear infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  @keyframes shake { 0%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-4px,1px) rotate(-3deg)} 50%{transform:translate(3px,-2px) rotate(2deg)} 75%{transform:translate(-2px,2px) rotate(-1deg)} 100%{transform:translate(0,0) rotate(0)} }
  @keyframes shakeHard { 0%{transform:translate(0,0) rotate(0) scale(1.04)} 25%{transform:translate(-9px,3px) rotate(-6deg) scale(1.08)} 50%{transform:translate(8px,-5px) rotate(5deg) scale(1.1)} 75%{transform:translate(-6px,4px) rotate(-3deg) scale(1.08)} 100%{transform:translate(0,0) rotate(0) scale(1.04)} }
  #drumtext { font-size:clamp(28px,8vw,52px); font-weight:900; color:var(--accent); min-height:1.3em; margin:28px 0 0; letter-spacing:2px; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:5; }
  #flash.on { animation:flash .5s ease-out forwards; }
  @keyframes flash { 0%{opacity:1} 100%{opacity:0} }
  .confetti { position:fixed; width:10px; height:16px; z-index:4; pointer-events:none; border-radius:2px; }
  #scare {
    position:fixed; inset:0; background:#000; z-index:10; display:none;
    align-items:center; justify-content:center;
  }
  #scare.on { display:flex; animation:shakeScreen .08s linear 10; }
  #scare img { width:100%; height:100%; object-fit:contain; transform:scale(.2); }
  #scare.on img { animation:zoomIn .18s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes zoomIn { to { transform:scale(1.05); } }
  @keyframes shakeScreen { 0%{transform:translate(0,0)} 25%{transform:translate(-14px,8px)} 50%{transform:translate(12px,-10px)} 75%{transform:translate(-8px,-6px)} 100%{transform:translate(0,0)} }
</style>
</head>
<body>
  <h1>🎁 선물이 도착했어요!</h1>
  <p id="hint">여기에 뭐가 들어있을까요?? 상자를 눌러보세요!</p>
  <div id="stage">
    <img id="drum" src="img/drum.png" alt="">
    <img id="box" src="img/giftbox.png" alt="선물 상자">
  </div>
  <p id="drumtext"></p>
  <div id="flash"></div>
  <div id="scare"><img src="img/surprise.jpg" alt=""></div>

<script>
(() => {
  const box = document.getElementById('box');
  const drum = document.getElementById('drum');
  const hint = document.getElementById('hint');
  const drumtext = document.getElementById('drumtext');
  const flash = document.getElementById('flash');
  const scare = document.getElementById('scare');
  let started = false, ctx;

  // --- synthesized sounds (no audio files) ---
  function noiseBuf(sec) {
    const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function snare(t, vol) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuf(0.15);
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1200;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    n.connect(f).connect(g).connect(ctx.destination); n.start(t); n.stop(t + 0.15);
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.08);
    const og = ctx.createGain();
    og.gain.setValueAtTime(vol * 0.6, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    o.connect(og).connect(ctx.destination); o.start(t); o.stop(t + 0.1);
  }
  function tom(t, vol) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.25);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.32);
  }
  function boom(t) {
    // big pop: noise burst + sub drop + cymbal crash
    const n = ctx.createBufferSource(); n.buffer = noiseBuf(1.5);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(6000, t); f.frequency.exponentialRampToValueAtTime(300, t + 1.2);
    const g = ctx.createGain();
    g.gain.setValueAtTime(1.0, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
    n.connect(f).connect(g).connect(ctx.destination); n.start(t); n.stop(t + 1.5);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.6);
    const og = ctx.createGain();
    og.gain.setValueAtTime(1.0, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    o.connect(og).connect(ctx.destination); o.start(t); o.stop(t + 0.85);
    // screechy sting
    const s = ctx.createOscillator(); s.type = 'sawtooth';
    s.frequency.setValueAtTime(900, t); s.frequency.linearRampToValueAtTime(1400, t + 0.9);
    const sg = ctx.createGain();
    sg.gain.setValueAtTime(0.25, t); sg.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    s.connect(sg).connect(ctx.destination); s.start(t); s.stop(t + 1.25);
  }

  const words = ['두', '구', '두', '구', '두', '구', '두', '굳'];

  function confetti() {
    const colors = ['#ff4d79', '#ffd23f', '#3bceac', '#5e60ce', '#ff9f1c'];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colors[i % colors.length];
      c.style.left = '50%'; c.style.top = '45%';
      document.body.appendChild(c);
      const a = Math.random() * Math.PI * 2, d = 200 + Math.random() * 400;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], { duration: 900, easing: 'cubic-bezier(.1,.8,.3,1)' }).onfinish = () => c.remove();
    }
  }

  function start() {
    if (started) return; started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    hint.textContent = '과연... 뭐가 들어있을까요?! 🥁';
    document.getElementById('stage').classList.add('rolling');
    drum.classList.add('show', 'hit');

    const T = 3.2;               // drum roll length (s)
    const t0 = ctx.currentTime + 0.05;
    let t = t0, gap = 0.11, i = 0;
    while (t < t0 + T) {
      const p = (t - t0) / T;
      snare(t, 0.25 + p * 0.55);
      if (i % 4 === 0) tom(t, 0.5 + p * 0.4);
      gap = 0.11 - p * 0.07;      // speeds up
      t += gap; i++;
    }
    boom(t0 + T + 0.05);

    // text: 두구두구두굳...
    let w = 0;
    const startMs = performance.now();
    (function tick() {
      const el = (performance.now() - startMs) / 1000;
      if (el >= T) return;
      drumtext.textContent = words.slice(0, (w++ % words.length) + 1).join('');
      if (el > T * 0.6) drum.classList.add('hard');
      setTimeout(tick, 150 - (el / T) * 90);
    })();

    setTimeout(() => {
      drumtext.textContent = '팡~!!! 💥';
      flash.classList.add('on');
      confetti();
      box.style.visibility = 'hidden';
      drum.classList.remove('show');
      setTimeout(() => {
        scare.classList.add('on');
        if (navigator.vibrate) navigator.vibrate([200, 80, 300]);
      }, 120);
    }, (T + 0.05) * 1000);
  }

  box.addEventListener('click', start);
  document.getElementById('stage').addEventListener('click', start);
  scare.addEventListener('click', () => location.reload());
})();
</script>
</body>
</html>
